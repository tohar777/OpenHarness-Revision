[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tohar777", email = "zionitoar452@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ddgs>=9.16.1",
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "mcp>=2.3.0",
    "pymal>=0.6",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
